services:
  - type: web
    name: pismo-dedu-moroz
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_TO
        value: osipoveriko@gmail.com
      - key: MAIL_FROM
        value: onboarding@resend.dev
